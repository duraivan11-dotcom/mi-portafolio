<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #44668f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-nav {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .header-nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        .header-nav a:hover {
            color: #e0e7ff;
        }

        #caja {
            background-color: #d1cece;
            width: 500px;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid #dcdfe6;
        }

        #avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4f46e5;
            margin-bottom: 15px;
        }

        .saludo {
            font-size: 1rem;
            color: #6b7280;
            margin-bottom: 8px;
        }

        #nombre {
            font-size: 1.5rem;
            color: #1f2937;
            margin-bottom: 25px;
            min-height: 40px;
            word-break: break-word;
        }

        #nombre.link-maps {
            color: #2563eb;
            cursor: pointer;
            text-decoration: underline;
        }

        #nombre.link-maps:hover {
            color: #1d4ed8;
        }

        #icono {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .icono-item {
            font-size: 1.6rem;
            color: #6b7280;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .icono-item:hover, .icono-item.active {
            color: #4f46e5;
            background-color: #e0e7ff;
        }

        .maps-hint {
            font-size: 0.85rem;
            color: #2563eb;
            margin-top: 4px;
            display: block;
            font-weight: normal;
        }

        .mensaje-vacio {
            background-color: #d1cece;
            width: 500px;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid #dcdfe6;
            color: #1f2937;
        }

        .mensaje-vacio h3 {
            margin-bottom: 15px;
        }

        .mensaje-vacio a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .mensaje-vacio a:hover {
            background-color: #3e38a0;
        }
    </style>
</head>
<body id="body">
    <div class="header-nav">
        <a href="index.html">← Volver a Inicio</a>
        <a href="favoritos.html">Favoritos ✪</a>
    </div>

    <div id="caja" style="display: none;">
        <img id="avatar" alt="Foto de perfil" src="">
        <p id="saludo" class="saludo">Hola, mi nombre es</p>
        <h1 id="nombre">Cargando...</h1>
        <div id="maps-info" style="display: none;">
            <span class="maps-hint"><i class="fa-solid fa-arrow-up-right-from-square"></i> Haz clic en la dirección o en el ícono para abrir en Google Maps</span>
        </div>

        <div id="icono">
            <div id="icono-usuario" class="icono-item active"><i class="fa-solid fa-user"></i></div>
            <div id="icono-email" class="icono-item"><i class="fa-solid fa-envelope"></i></div>
            <div id="icono-celular" class="icono-item"><i class="fa-solid fa-mobile-screen-button"></i></div>
            <div id="icono-direccion" class="icono-item"><i class="fa-solid fa-location-dot"></i></div>
            <div id="icono-telefono" class="icono-item"><i class="fa-solid fa-phone"></i></div>
            <div id="icono-seguridad" class="icono-item"><i class="fa-solid fa-lock"></i></div>
        </div>
    </div>

    <div id="contenedor-detalle"></div>

    <script src="js/detalle.js"></script>
</body>
</html>
